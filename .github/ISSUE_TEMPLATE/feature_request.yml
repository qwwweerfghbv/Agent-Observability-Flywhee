name: "✨ 功能建议 / Feature Request"
description: "提出一个新特性或改进 / Propose a new feature or improvement"
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem
      description: 这个特性想解决什么痛点？是否与某个 Agent 工程化场景相关？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案 / Proposed solution
      description: 你希望它如何工作？涉及哪一层（Harness 内核 / 可观测 / 评测飞轮 / 业务服务 / 前端）？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives
      description: 你考虑过的其他做法，以及为何不选它们。
  - type: checkboxes
    id: scope
    attributes:
      label: 归属主线 / Which pillar
      options:
        - label: 可观测 Observability
        - label: 评测飞轮 Evaluation Flywheel
        - label: Harness 内核
        - label: 业务场景（求职）
        - label: 前端 / 文档 / 其他
